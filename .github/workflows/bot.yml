name: Telegram Bot Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (NO SECRETS)
        env:
          TOKEN: "8597659675:AAH5Api5SZIOZmzYiE57ba4Jhv5U6t88VZ4"
          CHANNEL_ID: "-1002150432597"
        run: python main.py
