name: Telegram Bot Cron

on:
  schedule:
    - cron: "0 12 * * *"  # каждый день 12:00 UTC
  workflow_dispatch:  # ручной запуск

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python main.py